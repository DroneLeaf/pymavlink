# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Build and Optionally Publish

env:
  MAVLINK_TAG: dev-sitl

on:
  # Any code push (branches or tags) so CI still runs for every commit
  push:
    branches: ['**']
    tags:     ['v*']         # e.g. v0.3.1
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      # This allows us to save the more expensive full build for the main branch
      # and releases, while using a lighter build for PRs
      - name: Set build matrix
        id: set-matrix
        shell: python
        run: |
          import json, os
          ref   = os.environ.get("GITHUB_REF", "")
          is_tag = ref.startswith("refs/tags/")

          if is_tag:  # 🟢 full matrix on tag pushes
              machines = [
                  ("linux", "ubuntu-latest", "auto"),
                  ("linux-arm", "ubuntu-24.04-arm", "auto"),
                  ("macos", "macos-latest", "arm64 x86_64 universal2"),
                  ("windows", "windows-latest", "auto"),
                  # ("windows-arm", "windows-11-arm", "auto"), # Can't do this one yet, as lxml doesn't have Windows ARM wheels, and the runner doesn't have libxml2 pre-installed
              ]
              py_versions = [
                "3.8",
                "3.9",
                "3.10",
                "3.11",
                "3.12",
                "3.13"
              ]
          else:        # 🔵 cheap matrix for branch pushes / PRs / manual runs
              machines = [
                  ("linux", "ubuntu-latest", "native"),
                  ("windows", "windows-latest", "native"),
              ]
              py_versions = [
                "3.8",
                "3.11",
                "3.13"
              ] # Testing oldest, commonly used, and newest Python versions

          matrix = {"include": []}
          for (name, runner, cibw_archs) in machines:
              for py in py_versions:
                  matrix["include"].append({
                      "name": f"python{py}-{name}",
                      "os": runner,
                      "python_version": py,
                      "cibw_build": f"cp{py.replace('.', '')}-*",
                      "cibw_archs": cibw_archs,
                  })

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")

  build-wheels:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_VERSION: ${{ matrix.python_version }}
    steps:
    - uses: actions/checkout@v2
    - name: Install mavlink definitions
      shell: bash
      run: |
        git clone --branch "$MAVLINK_TAG" --depth 1 https://github.com/DroneLeaf/leaf-mavlink.git .mavtmp
        rm -rf message_definitions
        cp -a .mavtmp/message_definitions .
    - name: Set CIBW_BUILD
      shell: bash
      run: echo "CIBW_BUILD=cp${PYTHON_VERSION/./}-*" >> $GITHUB_ENV
    - name: Build wheels
      uses: pypa/cibuildwheel@v2.23.3
      env:
        PYMAVLINK_FAST_INDEX: "1"
        CIBW_BUILD: ${{ matrix.cibw_build }}
        CIBW_ARCHS: ${{ matrix.cibw_archs }}
        # Disable pip's build isolation so MDEF environment variable is passed to setup.py
        CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
        # Copy message_definitions to a fixed location and set MDEF
        CIBW_BEFORE_BUILD_LINUX: |
          set -e
          cp -r {project}/message_definitions /tmp/message_definitions
          echo "Message definitions copied to /tmp/message_definitions"
          ls -la /tmp/message_definitions/v1.0/ | head -5
          grep -c "LEAF_" /tmp/message_definitions/v1.0/droneleaf_mav_msgs.xml || echo "WARNING: No LEAF messages found"
          # Install system dependencies FIRST (needed for lxml)
          if command -v yum >/dev/null 2>&1; then
            yum install -y libxml2-devel libxslt-devel
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache libxml2-dev libxslt-dev
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -y
            DEBIAN_FRONTEND=noninteractive \
            apt-get install -y libxml2-dev libxslt1-dev
          fi
          # Then install Python packages
          pip install future lxml wheel setuptools Cython
        CIBW_BEFORE_BUILD_MACOS: |
          cp -r {project}/message_definitions /tmp/message_definitions
          echo "Message definitions copied to /tmp/message_definitions"
          pip install future lxml wheel setuptools Cython
        CIBW_BEFORE_BUILD_WINDOWS: >-
          xcopy /E /I /Y /Q "{project}\message_definitions" "C:\tmp\message_definitions\" &&
          pip install future lxml wheel setuptools Cython
        CIBW_ENVIRONMENT_LINUX: "MDEF=/tmp/message_definitions"
        CIBW_ENVIRONMENT_MACOS: "MDEF=/tmp/message_definitions"
        # Use forward slashes for Windows - Python handles them correctly
        CIBW_ENVIRONMENT_WINDOWS: "MDEF=C:/tmp/message_definitions"
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: wheelhouse/*.whl
        if-no-files-found: error
  build-sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: "3.9"
    - name: Install mavlink messages
      run: |
        git clone --branch "$MAVLINK_TAG" --depth 1 https://github.com/DroneLeaf/leaf-mavlink.git .mavtmp
        rm -rf message_definitions
        cp -a .mavtmp/message_definitions .
        echo "Checking for LEAF messages in droneleaf_mav_msgs.xml:"
        grep -c "LEAF_" message_definitions/v1.0/droneleaf_mav_msgs.xml
    - name: Install dependencies
      run: |
        python3 -m pip install -U pip
        python3 -m pip install -U wheel
        python3 -m pip install build
        MDEF=$PWD/message_definitions python3 -m pip install -U .
    - name: Verify LEAF messages were generated
      run: |
        python3 -c "from pymavlink.dialects.v20 import droneleaf_mav_msgs as m; print('LEAF_HEARTBEAT:', hasattr(m, 'MAVLINK_MSG_ID_LEAF_HEARTBEAT'))"
    - name: Build sdist
      env:
        MDEF: ${{ github.workspace }}/message_definitions
      run: pipx run build --sdist
    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz
        if-no-files-found: error

  # Verify that all required MAVLink messages exist in the built artifacts
  # This blocks publishing if verification fails
  verify-messages:
    name: Verify Messages (${{ matrix.artifact }})
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          # Use python3.11-linux which exists in both cheap and full matrix builds
          - artifact: python3.11-linux
            python-version: '3.11'
            install-type: wheel
          - artifact: sdist
            python-version: '3.11'
            install-type: sdist

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

      - name: List downloaded artifacts
        run: ls -la dist/

      - name: Install from wheel
        if: matrix.install-type == 'wheel'
        run: |
          python -m pip install --upgrade pip
          # Find and install the manylinux wheel (most compatible)
          WHEEL=$(ls dist/*manylinux*.whl 2>/dev/null | head -1 || ls dist/*.whl | head -1)
          echo "Installing wheel: $WHEEL"
          python -m pip install "$WHEEL"

      - name: Install from sdist
        if: matrix.install-type == 'sdist'
        run: |
          python -m pip install --upgrade pip
          SDIST=$(ls dist/*.tar.gz | head -1)
          echo "Installing sdist: $SDIST"
          python -m pip install "$SDIST"

      - name: Show installed pymavlink version
        run: |
          python -c "import pymavlink; print(f'pymavlink version: {pymavlink.__version__}')"

      - name: Verify required messages exist
        run: |
          python .github/workflows/verify_pymavlink_messages.py --verbose

  publish:
    needs: [build-wheels, build-sdist, verify-messages]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write           # (needed to create the release)
      id-token: write           # (optional) for OIDC login to PyPI instead of passwords

    steps:
      # 1️⃣  Grab the artefacts we just built
      - name: Download dist artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -lh dist/

      # 2️⃣  (Optional) Creates the release if it doesn't exist, or re-uses it if someone made it manually.
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name:     ${{ github.ref_name }}
          body:     "Auto-generated wheels and sdist."
          draft:    false
          prerelease: false

      - name: Upload wheels & sdist to the Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/**/*

      # 3️⃣  Upload to **Test PyPI**
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}   # create in repo/org secrets
          skip-existing: true

      # # 4️⃣  Smoke-test: install the exact tag from TestPyPI on a clean venv
      # - name: Verify install from TestPyPI
      #   shell: bash
      #   run: |
      #     python -m venv /tmp/venv
      #     source /tmp/venv/bin/activate
      #     python -m pip install --upgrade pip
      #     # Disable the main index so we’re 100 % sure we are using TestPyPI
      #     python -m pip install \
      #       --index-url https://test.pypi.org/simple/ \
      #       --no-deps \
      #       "pymavlink==${{ github.ref_name#v }}"
      #     python - <<'PY'
      #     import sys, pymavlink
      #     print("Imported pymavlink", pymavlink.__version__)
      #     PY

      # 4️⃣  If the previous step didn’t raise, push to **production PyPI**
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://upload.pypi.org/legacy/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}        # create in repo/org secrets
          skip-existing: true